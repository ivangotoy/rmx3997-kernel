name: RMX3997 kernel

# Builds run on the maintainer's own host runner. Only people with write
# access can trigger them: manual dispatch, or pushing an rmx3997-* tag.
# There is deliberately no pull_request trigger. The weekly upstream job
# (upstream-rmx3997.yml) builds and releases its own tags; a tag that already
# has a release is not built again.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit to build (optional; guards against a moving branch)
        required: false
        default: ''
        type: string
      github_release_tag:
        description: Only copy the existing Forgejo release of this rmx3997-vN tag to GitHub (no build)
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'rmx3997-*'

concurrency:
  group: rmx3997-kernel-build
  cancel-in-progress: false

jobs:
  build:
    # Forks and mirrors never schedule jobs onto the host runner.
    if: forgejo.repository == 'ivangotoy/rmx3997-kernel'
    runs-on: rmx3997-builder
    timeout-minutes: 150
    steps:
      # Plain git instead of actions/checkout: that action logs host paths
      # (workspace, HOME, credential helper files) into the public run log.
      # The job token is passed only as a header in git's environment (not its
      # argv, which other processes can read); the user's global
      # and system git config (and its credential helper) are not consulted.
      - name: Checkout
        env:
          TOKEN: ${{ forgejo.token }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -Eeuo pipefail
          case "$PWD" in "$HOME"/forgejo-runners/*/workspace/*) ;; *) echo 'FAIL: unexpected workspace'; exit 1;; esac
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init -q .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: basic $auth" \
            git fetch -q --depth 1 --no-tags "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git" "$FORGEJO_SHA"
          git checkout -q --detach FETCH_HEAD
          echo "checked out $(git rev-parse HEAD)"

      # Recovery for a tag whose Forgejo release exists but whose GitHub copy
      # failed: github_release_tag skips the build and runs only the copy.
      # Only constants are written to FORGEJO_ENV; the tag is read from the
      # input again by the copy step.
      - name: GitHub copy only (github_release_tag input)
        env:
          RELEASE_TAG_INPUT: ${{ inputs.github_release_tag }}
        run: |
          set -Eeuo pipefail
          [ -n "$RELEASE_TAG_INPUT" ] || exit 0
          if ! [[ "$RELEASE_TAG_INPUT" =~ ^rmx3997-v[0-9]+$ ]]; then
            echo 'FAIL: github_release_tag must be an rmx3997-vN tag'; exit 1
          fi
          echo "GitHub copy only for $RELEASE_TAG_INPUT; no build"
          printf 'RMX_SKIP=1\nRMX_GH_ONLY=1\n' >> "$FORGEJO_ENV"

      - name: Copy an existing release to GitHub (github_release_tag input)
        if: env.RMX_GH_ONLY == '1'
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.github_release_tag }}
        run: |
          python3 -I rmx3997/ci/rmx_ci.py github-release --forgejo-api "$FORGEJO_API_URL" \
            --repo "$FORGEJO_REPOSITORY" --github-repo ivangotoy/rmx3997-kernel --tag "$RELEASE_TAG_INPUT"

      # The upstream job pushes its tag with the job token, which does not start
      # workflows, and publishes the release in the same run. Both workflows
      # share one concurrency group, so a run for such a tag could only start
      # after that release exists: skip it instead of building the same commit
      # twice. Any lookup result other than 200 or 404 fails the run, and so
      # does a 200 for an unpublished draft: it is not a release yet.
      - name: Skip a tag that is already released
        if: forgejo.ref_type == 'tag'
        run: |
          set -Eeuo pipefail
          # curl rewrites the -o file on a retry; inside .git/ it stays out of git status.
          code=$(curl -sS --connect-timeout 30 --max-time 60 --retry 5 --retry-delay 10 -o .git/release-lookup.json -w '%{http_code}' \
            "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/releases/tags/$FORGEJO_REF_NAME")
          case "$code" in
            404) echo "no release for $FORGEJO_REF_NAME yet; building" ;;
            200) state=$(python3 -I -c 'import json,sys; print({False: "published", True: "draft"}.get(json.load(open(sys.argv[1])).get("draft"), "unknown"))' .git/release-lookup.json 2>/dev/null || echo unknown)
                 case "$state" in
                   published) echo "SKIP: $FORGEJO_REF_NAME already has a release; not building it again"
                              echo 'RMX_SKIP=1' >> "$FORGEJO_ENV" ;;
                   draft) echo "FAIL: $FORGEJO_REF_NAME has an unpublished draft release; publish or delete it on the server, then run again"; exit 1 ;;
                   *) echo 'FAIL: release lookup answer has no draft state'; exit 1 ;;
                 esac ;;
            *) echo "FAIL: release lookup returned HTTP $code"; exit 1 ;;
          esac

      - name: Bind to the exact commit
        if: env.RMX_SKIP != '1'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ forgejo.sha }}
        run: |
          set -Eeuo pipefail
          head=$(git rev-parse HEAD)
          test "$head" = "$EVENT_SHA"
          if [ -n "$EXPECTED_SHA" ]; then test "$head" = "$EXPECTED_SHA"; fi
          test -z "$(git status --porcelain)"
          echo "building $head"

      - name: Prepare disk-backed stage
        if: env.RMX_SKIP != '1'
        run: |
          set -Eeuo pipefail
          case "$(findmnt -n -o FSTYPE --target "$HOME/.cache")" in ext4|xfs|btrfs) ;; *) echo 'FAIL: stage would not be disk-backed'; exit 1;; esac
          STAGE="$HOME/.cache/rmx3997-ci/run-${FORGEJO_RUN_ID}-${FORGEJO_RUN_ATTEMPT:-1}"
          test ! -e "$STAGE"
          install -d -m 700 "$STAGE"
          echo "STAGE=$STAGE" >> "$FORGEJO_ENV"
          df -h --output=avail "$HOME/.cache" | tail -1

      # Build trees of failed runs older than 7 days (what "Remove build tree"
      # would have removed); a prune error is a warning, never a failure.
      - name: Prune old stage build trees
        if: env.RMX_SKIP != '1'
        run: python3 -I rmx3997/ci/rmx_ci.py prune-stages --keep "$STAGE"

      # Offline unit tests of the CI scripts themselves (stubbed APIs, seconds).
      - name: CI script tests
        if: env.RMX_SKIP != '1'
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$STAGE/tmp"
          TMPDIR="$STAGE/tmp" PYTHONPYCACHEPREFIX="$STAGE/pycache" python3 -I rmx3997/ci/test_ci.py

      - name: Verify pinned host inputs
        if: env.RMX_SKIP != '1'
        run: python3 -I rmx3997/ci/rmx_ci.py preflight

      # Every pin in rmx3997/ci/upstreams.json must equal the live head of its
      # upstream. A tree that is behind, or a failed lookup, fails here in
      # seconds, before any compile.
      - name: Upstream freshness gate
        if: env.RMX_SKIP != '1'
        run: python3 -I rmx3997/ci/upstream.py fresh

      # Stock AnyKernel3 at its upstreams.json pin, fetched before the build so a
      # failed fetch costs no compile; the Package step ships it unmodified.
      - name: Fetch AnyKernel3 at its pin
        if: env.RMX_SKIP != '1'
        run: python3 -I rmx3997/ci/rmx_ci.py anykernel --stage "$STAGE"

      - name: Build (config gate, guarded Full-LTO build)
        if: env.RMX_SKIP != '1'
        run: bash rmx3997/ci/build.sh "$STAGE"

      - name: Acceptance gates
        if: env.RMX_SKIP != '1'
        run: python3 -I rmx3997/ci/rmx_ci.py accept --stage "$STAGE"

      - name: Package ZIP (boot_b image stays on the host)
        if: env.RMX_SKIP != '1'
        env:
          LABEL: ${{ forgejo.ref_type == 'tag' && forgejo.ref_name || format('ci{0}', forgejo.run_number) }}
          RUN_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_number }}
        run: |
          set -Eeuo pipefail
          python3 -I rmx3997/ci/rmx_ci.py package --stage "$STAGE" --label "$LABEL" \
            --commit "$(git rev-parse HEAD)" --run-url "$RUN_URL"
          cat "$STAGE/dist.env" >> "$FORGEJO_ENV"

      - name: Upload build artifact
        if: env.RMX_SKIP != '1'
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: ${{ env.RMX_BASE }}
          path: ${{ env.RMX_DIST }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tag builds only)
        if: forgejo.ref_type == 'tag' && env.RMX_SKIP != '1'
        env:
          RELEASE_TOKEN: ${{ forgejo.token }}
          RUN_URL: ${{ forgejo.server_url }}/${{ forgejo.repository }}/actions/runs/${{ forgejo.run_number }}
        run: |
          python3 -I rmx3997/ci/rmx_ci.py release --api "$FORGEJO_API_URL" \
            --repo "$FORGEJO_REPOSITORY" --tag "$FORGEJO_REF_NAME" \
            --commit "$(git rev-parse HEAD)" --dist "$RMX_DIST" --run-url "$RUN_URL"

      # The GitHub mirror gets git refs from the Forgejo push mirror; this copies
      # the published release (the same ZIP and checksum) onto the mirrored tag.
      # It never creates or moves a tag and never edits an existing release.
      - name: Copy release to GitHub (tag builds only)
        if: forgejo.ref_type == 'tag' && env.RMX_SKIP != '1'
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          python3 -I rmx3997/ci/rmx_ci.py github-release --forgejo-api "$FORGEJO_API_URL" \
            --repo "$FORGEJO_REPOSITORY" --github-repo ivangotoy/rmx3997-kernel --tag "$FORGEJO_REF_NAME"

      - name: Remove build tree
        if: success() && env.RMX_SKIP != '1'
        run: rm -rf "$STAGE/out" "$STAGE/work" "$STAGE/tmp" "$STAGE/pycache"
